name: CD

on:
  push:
    branches: [master, cicd]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Install Convex CLI
      - name: Install Convex
        run: npm install -g convex

      # Deploy backend to production
      - name: Deploy Convex backend
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Set SITE_URL so Convex Auth redirects back to the deployed frontend after OAuth
      - name: Set Convex SITE_URL
        run: npx convex env set SITE_URL ${{ secrets.SITE_URL }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Set a stable production calendar token secret.
      # Do NOT generate a new random secret on each deploy.
      - name: Set Convex CALENDAR_TOKEN_SECRET
        run: npx convex env set CALENDAR_TOKEN_SECRET ${{ secrets.CALENDAR_TOKEN_SECRET }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Set the production SIS API key from GitHub secrets.
      - name: Set Convex JHU_SIS_API_KEY
        run: npx convex env set JHU_SIS_API_KEY ${{ secrets.JHU_SIS_API_KEY }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Build frontend
      - run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      
      - name: Check VITE_CONVEX_URL secret
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "VITE_CONVEX_URL is empty or  unset"
          else
            echo "VITE_CONVEX_URL is set: $VITE_CONVEX_URL"
          fi
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
